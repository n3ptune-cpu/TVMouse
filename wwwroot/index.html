<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080c">
<title>TV Remote</title>
<style>
  :root {
    --bg: #08080c;
    --surface: #14141d;
    --surface-hi: #222231;
    --accent: #7b5cff;
    --line: rgba(255,255,255,0.08);
    --text: #f5f5fa;
    --muted: #86869c;
  }
  * {
    box-sizing: border-box;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  }
  .remote {
    height: 100%; max-width: 420px; margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .conn { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #2ed573; }
  .dot.err { background: #ff4757; }
  .mini {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
  }
  .mini.active { background: var(--accent); border-color: transparent; }

  .drawer {
    display: none; flex-direction: column; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px;
  }
  .drawer.open { display: flex; }
  .search-box { display: flex; gap: 8px; }
  .search-box input {
    flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); padding: 0 12px; font-size: 16px; outline: none;
    user-select: text; -webkit-user-select: text; touch-action: auto;
  }
  .search-box button {
    background: var(--accent); border: none; color: #fff; border-radius: 12px;
    padding: 0 16px; font-size: 14px; font-weight: 600;
  }

  .pad {
    flex: 1; min-height: 190px; border-radius: 24px;
    background: var(--surface); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; font-weight: 600;
    touch-action: none;
  }
  .pad:active { border-color: rgba(123, 92, 255, 0.45); }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .btn-row.one { grid-template-columns: 1fr; }
  .btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: 18px; height: 56px; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:active { background: var(--surface-hi); transform: scale(0.98); }
  .btn.primary { background: var(--accent); border: none; color: #fff; }
</style>
</head>
<body>
  <div class="remote">
    <div class="bar">
      <div class="conn"><span class="dot" id="dot"></span>TV Remote</div>
      <button class="mini" id="typeBtn">Type</button>
    </div>

    <div class="drawer" id="drawer">
      <div class="search-box">
        <input id="q" type="text" placeholder="Type text..." enterkeyhint="send">
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <div class="pad" id="pad">Drag to move · Tap to click</div>

    <div class="btn-row">
      <button class="btn primary" data-post="/click">Left Click</button>
      <button class="btn" data-post="/rclick">Right Click</button>
    </div>

    <div class="btn-row">
      <button class="btn" data-cmd="SEEK_BACK">&#9194;</button>
      <button class="btn" data-cmd="SEEK_FWD">&#9193;</button>
    </div>

    <div class="btn-row">
      <button class="btn" data-cmd="NEXT">&#9197;</button>
      <button class="btn" data-cmd="SPACE">&#9199;</button>
    </div>

    <div class="btn-row three">
      <button class="btn" data-cmd="VOL_DOWN">&#128265;</button>
      <button class="btn" data-cmd="MUTE">&#128263;</button>
      <button class="btn" data-cmd="VOL_UP">&#128266;</button>
    </div>

    <div class="btn-row one">
      <button class="btn" data-cmd="BACK">&#8617;</button>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const dot = $('dot'), drawer = $('drawer'), typeBtn = $('typeBtn'), qInput = $('q'), pad = $('pad');

    function post(url) {
      return fetch(url, { method: 'POST' })
        .then((res) => dot.classList.toggle('err', !res.ok))
        .catch(() => dot.classList.add('err'));
    }

    // Block double-tap zoom, except in the text box
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      if (e.target === qInput) return;
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    typeBtn.addEventListener('click', () => {
      const open = drawer.classList.toggle('open');
      typeBtn.classList.toggle('active', open);
      if (open) setTimeout(() => qInput.focus(), 50);
    });

    function sendText() {
      const val = qInput.value.trim();
      if (!val) return;
      qInput.value = '';
      qInput.blur();
      post('/type?q=' + encodeURIComponent(val));
    }
    $('sendBtn').addEventListener('click', sendText);
    qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });

    document.querySelectorAll('[data-cmd]').forEach((b) =>
      b.addEventListener('click', () => post('/cmd?k=' + encodeURIComponent(b.dataset.cmd))));
    document.querySelectorAll('[data-post]').forEach((b) =>
      b.addEventListener('click', () => post(b.dataset.post)));

    // Touchpad
    let lastX = null, lastY = null, moved = 0, lastMoveTime = 0;
    const gain = 2.4;

    pad.addEventListener('pointerdown', (e) => { lastX = e.clientX; lastY = e.clientY; moved = 0; });

    pad.addEventListener('pointermove', (e) => {
      if (lastX === null) return;
      const now = performance.now();
      if (now - lastMoveTime < 25) return;
      const dx = Math.round((e.clientX - lastX) * gain);
      const dy = Math.round((e.clientY - lastY) * gain);
      moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
      if (dx !== 0 || dy !== 0) {
        lastX = e.clientX; lastY = e.clientY; lastMoveTime = now;
        post('/move?dx=' + dx + '&dy=' + dy);
      }
    });

    const endPad = () => {
      if (lastX !== null && moved < 8) post('/click');
      lastX = lastY = null;
      moved = 0;
    };
    pad.addEventListener('pointerup', endPad);
    pad.addEventListener('pointercancel', endPad);
  </script>
</body>
</html>
